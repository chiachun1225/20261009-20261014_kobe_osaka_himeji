<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 關西 6 日旅行控制台 🇯🇵</title>

<style>
:root{
  --nav:#17202a; --nav2:#22303d; --blue:#3b82f6; --blue2:#dbeafe;
  --bg:#eef2f6; --card:#fff; --text:#18212b; --muted:#64748b;
  --line:#e5e7eb; --green:#16a34a; --orange:#f59e0b; --red:#ef4444;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;color:var(--text);background:var(--bg)}
body{display:flex;overflow:hidden}

/* 左側日期 */
.sidebar{width:245px;background:linear-gradient(180deg,var(--nav),#111827);color:#fff;display:flex;flex-direction:column;flex-shrink:0}
.brand{padding:24px 20px 18px;border-bottom:1px solid #344250}
.brand h1{font-size:19px;margin:0 0 5px}
.brand p{font-size:12px;color:#aeb9c6;margin:0}
.days{padding:12px 10px;overflow:auto}
.day-btn{width:100%;border:0;background:transparent;color:#d7dee7;text-align:left;padding:14px 13px;margin:3px 0;border-radius:10px;cursor:pointer;transition:.2s}
.day-btn:hover{background:#263646}
.day-btn.active{background:var(--blue);color:#fff;box-shadow:0 5px 15px #0003}
.day-btn .d{font-weight:800;font-size:14px}
.day-btn .s{font-size:11px;opacity:.82;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{margin-top:auto;padding:15px 18px;color:#9aa7b5;font-size:11px;border-top:1px solid #344250}
.legend div{margin:5px 0}

/* 右側 */
.main{flex:1;min-width:0;height:100vh;padding:14px;display:grid;grid-template-rows:170px minmax(0,1fr);gap:14px}

/* 大綱 */
.overview{background:var(--card);border-radius:16px;padding:18px 20px;box-shadow:0 4px 18px #1e293b12;overflow:hidden}
.overview-head{display:flex;justify-content:space-between;align-items:center;gap:15px}
.overview h2{font-size:20px;margin:0}
.pill{font-size:12px;background:var(--blue2);color:#1d4ed8;border-radius:999px;padding:6px 10px;white-space:nowrap}
.overview-text{margin-top:12px;color:#475569;line-height:1.6;font-size:14px}
.highlights{display:flex;gap:8px;overflow:auto;margin-top:10px}
.tag{background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;white-space:nowrap}

/* 詳細 */
.detail{background:var(--card);border-radius:16px;box-shadow:0 4px 18px #1e293b12;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.detail-head{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.detail-head h3{margin:0;font-size:17px}
.detail-actions{display:flex;gap:7px}
.action{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer;color:#334155;text-decoration:none}
.action:hover{background:#f8fafc}
.detail-body{display:flex;min-height:0;flex:1}
.timeline{overflow:auto;padding:20px 30px 35px;width:100%}
.timeline-item{display:grid;grid-template-columns:120px 1fr;gap:18px;position:relative;padding-bottom:21px}
.timeline-item:before{content:"";position:absolute;left:124px;top:25px;bottom:-1px;width:2px;background:#dbe5f0}
.timeline-item:last-child:before{display:none}
.time{font-size:12px;font-weight:800;color:#2563eb;background:#eff6ff;border:1px solid #dbeafe;border-radius:8px;padding:7px 8px;height:max-content;text-align:center}
.event{position:relative;padding:1px 0 0 18px}
.event:before{content:"";position:absolute;left:-3px;top:6px;width:10px;height:10px;background:#3b82f6;border:3px solid #dbeafe;border-radius:50%;z-index:2}
.event-title{font-size:15px;font-weight:800;margin-bottom:6px}
.event-desc{font-size:13px;color:#64748b;line-height:1.65;white-space:pre-line}
.event-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.glink{display:inline-block;text-decoration:none;font-size:11px;border:1px solid #dbeafe;color:#1d4ed8;background:#eff6ff;padding:5px 8px;border-radius:7px}

/* 手機 / iPad */
@media(max-width:900px){
 body{overflow:auto;display:block}
 .sidebar{width:100%;height:auto}
 .brand{padding:14px 16px}
 .days{display:flex;overflow-x:auto;padding:8px}
 .day-btn{min-width:145px}
 .legend{display:none}
 .main{height:auto;min-height:calc(100vh - 95px);grid-template-rows:auto auto;padding:10px}
 .overview{min-height:145px}
 .detail-body{display:flex}
 .timeline{max-height:none}
}
@media(max-width:600px){
 .main{grid-template-rows:auto auto}
 .detail-body{display:flex;flex-direction:column}
 .timeline-item{grid-template-columns:85px 1fr}
 .timeline-item:before{left:89px}
}
</style>

let currentDay=1;
function googleSearch(name){
 return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(name);
}
function googleDay(points){
 if(!points || points.length===0)return "#";
 const origin=points[0];
 const destination=points[points.length-1];
 const waypoints=points.slice(1,-1).join("|");
 let url="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(origin)+"&destination="+encodeURIComponent(destination);
 if(waypoints)url+="&waypoints="+encodeURIComponent(waypoints);
 return url;
}
function renderDay(n){
 currentDay=n;
 const d=days[n];
 document.querySelectorAll(".day-btn").forEach((b,i)=>b.classList.toggle("active",i+1===n));
 document.getElementById("overviewTitle").textContent=d.title;
 document.getElementById("overviewPill").textContent=d.pill;
 document.getElementById("overviewText").textContent=d.overview;
 document.getElementById("highlights").innerHTML=d.tags.map(x=>`<span class="tag">${x}</span>`).join("");
 document.getElementById("detailTitle").textContent=d.title;
 const tl=document.getElementById("timeline");
 tl.innerHTML="";
 d.items.forEach((it)=>{
   const name=it[3] || "";
   const el=document.createElement("div");
   el.className="timeline-item";
   el.innerHTML=`
     <div class="time">${it[0]}</div>
     <div class="event">
       <div class="event-title">${it[1]}</div>
       <div class="event-desc">${it[2]}</div>
       ${name?`<div class="event-links"><a class="glink" target="_blank" rel="noopener" href="${googleSearch(name)}">📍 ${name}｜Google Maps</a></div>`:""}
     </div>`;
   tl.appendChild(el);
 });
 const all=googleDay(d.points);
 document.getElementById("googleAll").href=all;
}
function buildButtons(){
 const box=document.getElementById("dayButtons");
 Object.entries(days).forEach(([n,d])=>{
   const b=document.createElement("button");
   b.className="day-btn";
   b.innerHTML=`<div class="d">${d.date}</div><div class="s">${d.short}</div>`;
   b.onclick=()=>renderDay(Number(n));
   box.appendChild(b);
 });
}
buildButtons();
renderDay(1);
</script>
